<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alexa+ Smart Home — Simulated Client</title>
    <script type="importmap">
      {
        "imports": {
          "react": "https://esm.sh/react@18.3.1",
          "react-dom/client": "https://esm.sh/react-dom@18.3.1/client"
        }
      }
    </script>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a2e;
        --bg: #f7f7fb;
        --card: #ffffff;
        --accent: #5b3cc4;
        --real: #1b8a5a;
        --sim: #b8860b;
        --error: #b8272c;
        --border: #e2e2ee;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      .app {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 1.25rem 4rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.25rem;
      }
      .subtitle {
        color: #555;
        margin-top: 0;
      }
      .controls {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        flex-wrap: wrap;
        margin: 1.25rem 0;
        padding: 1rem;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
      }
      .controls input {
        flex: 1;
        min-width: 220px;
        padding: 0.4rem 0.6rem;
        border: 1px solid var(--border);
        border-radius: 6px;
        font-family: monospace;
      }
      .controls button {
        padding: 0.5rem 1rem;
        background: var(--accent);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
      }
      .controls button:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .error {
        background: #ffe8e8;
        border: 1px solid #f5b5b5;
        border-radius: 6px;
        padding: 0.75rem;
        margin-bottom: 1rem;
      }
      .turn {
        margin-bottom: 1rem;
        padding: 0.9rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--card);
      }
      .turn-user {
        border-left: 4px solid var(--accent);
      }
      .turn-agent {
        border-left: 4px solid #999;
      }
      .turn-speaker {
        font-weight: 600;
        font-size: 0.8rem;
        text-transform: uppercase;
        letter-spacing: 0.03em;
        color: #666;
        margin-bottom: 0.25rem;
      }
      .turn-text {
        margin-bottom: 0.5rem;
      }
      .tool-panel {
        margin-top: 0.5rem;
        padding: 0.75rem;
        border-radius: 6px;
        background: #fafaff;
        border: 1px dashed var(--border);
      }
      .tool-panel-head {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 0.4rem;
      }
      .badge {
        font-size: 0.7rem;
        font-weight: 700;
        padding: 0.15rem 0.5rem;
        border-radius: 999px;
        color: white;
      }
      .badge-real {
        background: var(--real);
      }
      .badge-sim {
        background: var(--sim);
      }
      .badge-error {
        background: var(--error);
      }
      .tool-panel-error {
        border: 1px dashed var(--error);
        background: #fff2f2;
      }
      .tool-note {
        font-size: 0.8rem;
        color: #765;
        margin: 0.25rem 0;
      }
      .turn-system {
        border-left: 4px solid var(--accent);
        background: #f3f0ff;
      }
      .confirm-outcome-panel {
        font-size: 0.9rem;
      }
      .confirm-outcome-confirm {
        color: var(--real);
      }
      .confirm-outcome-decline {
        color: var(--error);
      }
      .confirm-panel {
        margin-bottom: 1rem;
        padding: 1rem;
        border-radius: 8px;
        border: 2px solid var(--accent);
        background: #f3f0ff;
      }
      .confirm-panel-head {
        font-weight: 700;
        margin-bottom: 0.4rem;
      }
      .confirm-summary {
        font-family: monospace;
        margin: 0.2rem 0;
      }
      .confirm-rationale,
      .confirm-outcome {
        margin: 0.2rem 0;
        color: #444;
      }
      .confirm-blocked {
        color: var(--error);
        font-weight: 600;
      }
      .confirm-actions {
        display: flex;
        gap: 0.6rem;
        margin-top: 0.75rem;
      }
      .confirm-actions button {
        padding: 0.5rem 1.1rem;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      .btn-confirm {
        background: var(--real);
        color: white;
      }
      .btn-decline {
        background: var(--error);
        color: white;
      }
      .confirm-actions button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      pre {
        background: #1a1a2e;
        color: #e8e8f0;
        padding: 0.6rem;
        border-radius: 6px;
        overflow-x: auto;
        font-size: 0.8rem;
        margin: 0.25rem 0;
      }
      summary {
        cursor: pointer;
        font-size: 0.8rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
